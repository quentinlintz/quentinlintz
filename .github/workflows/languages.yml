name: Update language cards

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 6:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate top languages card dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&bg_color=191724&text_color=E0DEF4&langs_count=6&card_width=360&hide_border=true&hide_title=true&disable_animations=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&bg_color=FAF4ED&text_color=575279&langs_count=6&card_width=360&hide_border=true&hide_title=true&disable_animations=true
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        if: ${{ !env.ACT }}
        run: |
          set -xe
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/top-langs-dark.svg profile/top-langs-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update language cards"
            git fetch origin
            git rebase origin/main
            git push
          fi
